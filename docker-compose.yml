services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    networks:
      - app-network

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: queue-worker
    command: php artisan queue:work --tries=3 --backoff=5,15,30
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - app
    networks:
      - app-network

  webserver:
    image: nginx:stable-alpine
    container_name: webserver
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yandex_reviews
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata: